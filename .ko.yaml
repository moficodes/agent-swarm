# Same default base as substrate's .ko.yaml, which ateworker-gvisor is built with.
defaultBaseImage: gcr.io/distroless/static-debian13:nonroot@sha256:18f4cc26c9ffa7f20a359298be7deadac5c607c8e03a02b8119f1a5fc2f82c99

defaultPlatforms:
  - linux/amd64
  - linux/arm64

baseImageOverrides:
  # The workload runs the model's Python scripts and syntax-checks them.
  github.com/agent-substrate/agent-swarm/cmd/conf-workload: python:3.12-slim
